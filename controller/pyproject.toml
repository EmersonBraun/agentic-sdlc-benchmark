[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-benchmark-controller"
version = "0.1.0"
description = "Contract and run controller for the Agentic SDLC Benchmark"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
